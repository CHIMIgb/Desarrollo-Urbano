<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Planning 3D — Prototipo de Terreno</title>
  <meta name="description" content="Prototipo de modelado 3D de terreno urbano con datos satelitales. Editor de carreteras, casas y edificios sobre terreno real." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="2" y="14" width="8" height="12" rx="1" fill="#6366f1"/>
          <rect x="12" y="8" width="8" height="18" rx="1" fill="#8b5cf6"/>
          <rect x="22" y="11" width="4" height="15" rx="1" fill="#a78bfa"/>
          <path d="M2 14 L26 14" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3,2"/>
        </svg>
        <span class="logo-text">UrbanPlan <span class="logo-tag">3D</span></span>
      </div>
      <div class="project-name" id="projectName" contenteditable="true" spellcheck="false">Proyecto Sin Título</div>
    </div>
    <div class="header-center">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar ubicación..." autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn btn-ghost" id="btnUndo" title="Deshacer (Ctrl+Z)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="btn btn-ghost" id="btnRedo" title="Rehacer (Ctrl+Y)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
      </button>
      <div class="divider-v"></div>
      <button class="btn btn-secondary" id="btnExport">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar GeoJSON
      </button>
      <button class="btn btn-primary" id="btnSave">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar
      </button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="app-body">
    <!-- LEFT TOOLBAR -->
    <aside class="toolbar" id="toolbar">
      <div class="tool-group">
        <div class="tool-label">Navegación</div>
        <button class="tool-btn active" id="tool-select" data-tool="select" title="Seleccionar (S)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-4 6z"/></svg>
          <span>Seleccionar</span>
        </button>
      </div>
      <div class="tool-group">
        <div class="tool-label">Objetos</div>
        <button class="tool-btn" id="tool-house" data-tool="house" title="Casa (H)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Casa</span>
        </button>
        <button class="tool-btn" id="tool-building" data-tool="building" title="Edificio Caja (B)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
          <span>Edificio</span>
        </button>
        <button class="tool-btn" id="tool-custom-building" data-tool="custom_building" title="Silueta 3D (C)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <span>Silueta 3D</span>
        </button>
        <button class="tool-btn" id="tool-park" data-tool="park" title="Parque (P)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 1 7 7c0 4-3 6-5 8H10C8 15 5 13 5 9a7 7 0 0 1 7-7z"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
          <span>Parque</span>
        </button>
      </div>
      <div class="tool-group">
        <div class="tool-label">Trazado</div>
        <button class="tool-btn" id="tool-road" data-tool="road" title="Carretera (R)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17h4l2-8h6l2 8h4"/><line x1="7" y1="11" x2="17" y2="11"/></svg>
          <span>Carretera</span>
        </button>
        <button class="tool-btn" id="tool-zone" data-tool="zone" title="Zona (Z)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          <span>Zona</span>
        </button>
        <button class="tool-btn" id="tool-terrain" data-tool="terrain" title="Terreno/Parcela (T)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18" stroke-dasharray="2 2"/></svg>
          <span>Terreno</span>
        </button>
      </div>
      <div class="tool-group">
        <div class="tool-label">Edición</div>
        <button class="tool-btn" id="tool-move" data-tool="move" title="Mover (M)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M9 19l3 3 3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
          <span>Mover</span>
        </button>
        <button class="tool-btn tool-btn-danger" id="tool-delete" data-tool="delete" title="Borrar (Del)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          <span>Borrar</span>
        </button>
      </div>
      <div class="tool-group">
        <div class="tool-label">Vista</div>
        <button class="tool-btn" id="tool-3d" title="Vista 3D">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          <span>3D / 2D</span>
        </button>
        <button class="tool-btn" id="tool-satellite" title="Satélite / Mapa">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>Satélite</span>
        </button>
      </div>
    </aside>

    <!-- MAP CONTAINER -->
    <main class="map-wrapper">
      <!-- CONTEXTUAL OPTIONS BAR -->
      <div class="options-bar" id="roadOptionsBar" style="display:none">
        <span class="opt-label">Carretera</span>
        <div class="opt-divider"></div>
        <label class="opt-item">
          <span>Ancho</span>
          <select id="roadWidthSelect">
            <option value="4">Local &mdash; 4m</option>
            <option value="8" selected>Secundaria &mdash; 8m</option>
            <option value="12">Primaria &mdash; 12m</option>
            <option value="24">Autopista &mdash; 24m</option>
            <option value="custom">Personalizado</option>
          </select>
        </label>
        <input type="number" id="roadWidthCustom" min="2" max="60" value="8" style="display:none;width:54px" />
        <div class="opt-divider"></div>
        <label class="opt-item opt-toggle">
          <input type="checkbox" id="roadCurved" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span>Curvas suaves</span>
        </label>
      </div>

      <div class="options-bar" id="polygonOptionsBar" style="display:none">
        <span class="opt-label" id="polyLabel">Polígono</span>
        <div class="opt-divider"></div>
        <label class="opt-item opt-toggle">
          <input type="checkbox" id="polyCurved" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span>Curvas suaves</span>
        </label>
      </div>

      <div class="options-bar" id="buildingOptionsBar" style="display:none">
        <span class="opt-label">Edificio</span>
        <div class="opt-divider"></div>
        <label class="opt-item"><span>Ancho (m)</span><input type="number" id="bldWidth" value="20" min="2" max="500" /></label>
        <label class="opt-item"><span>Largo (m)</span><input type="number" id="bldLength" value="20" min="2" max="500" /></label>
        <label class="opt-item"><span>Altura (m)</span><input type="number" id="bldHeight" value="30" min="3" max="600" /></label>
        <label class="opt-item"><span>Rotaci&oacute;n</span>
          <input type="range" id="bldRotation" min="0" max="359" value="0" style="width:80px" />
          <span id="bldRotVal">0&deg;</span>
        </label>
      </div>

      <div class="options-bar" id="houseOptionsBar" style="display:none">
        <span class="opt-label">Casa</span>
        <div class="opt-divider"></div>
        <label class="opt-item"><span>Ancho (m)</span><input type="number" id="hsWidth" value="10" min="2" max="100" /></label>
        <label class="opt-item"><span>Largo (m)</span><input type="number" id="hsLength" value="10" min="2" max="100" /></label>
        <label class="opt-item"><span>Altura (m)</span><input type="number" id="hsHeight" value="7" min="3" max="60" /></label>
        <label class="opt-item"><span>Rotaci&oacute;n</span>
          <input type="range" id="hsRotation" min="0" max="359" value="0" style="width:80px" />
          <span id="hsRotVal">0&deg;</span>
        </label>
      </div>

      <div id="map"></div>
      <!-- Road drawing hint -->
      <div class="draw-hint" id="drawHint" style="display:none">
        <span id="drawHintText">Click para colocar puntos &mdash; Doble click para terminar</span>
      </div>
      <!-- Coordinate display -->
      <div class="coord-display" id="coordDisplay">0.000000, 0.000000</div>
      <!-- Live area display while drawing -->
      <div class="draw-measure" id="drawMeasure" style="display:none"></div>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="props-panel" id="propsPanel">
      <!-- Layers Tab -->
      <div class="panel-section">
        <div class="panel-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          Capas
        </div>
        <div class="panel-header"><h3>Capas (Visibilidad)</h3></div>
        <div class="layers-list" id="layersList">
          <label class="layer-item"><input type="checkbox" checked data-layer="house" /><span class="layer-dot" style="background:#f59e0b"></span>Casas</label>
          <label class="layer-item"><input type="checkbox" checked data-layer="building" /><span class="layer-dot" style="background:#6366f1"></span>Edificios</label>
          <label class="layer-item"><input type="checkbox" checked data-layer="custom_building" /><span class="layer-dot" style="background:#8b5cf6"></span>Siluetas 3D</label>
          <label class="layer-item"><input type="checkbox" checked data-layer="road" /><span class="layer-dot" style="background:#94a3b8"></span>Carreteras</label>
          <label class="layer-item"><input type="checkbox" checked data-layer="park" /><span class="layer-dot" style="background:#4ade80"></span>Parques</label>
          <label class="layer-item"><input type="checkbox" checked data-layer="zone" /><span class="layer-dot" style="background:#f472b6"></span>Zonas</label>
          <label class="layer-item"><input type="checkbox" checked data-layer="terrain" /><span class="layer-dot" style="background:#fb923c"></span>Terrenos</label>
        </div>
      </div>

      <!-- Properties -->
      <div class="panel-section" id="propsSection" style="display:none">
        <div class="panel-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Propiedades
        </div>
        <div class="props-form" id="propsForm"></div>
      </div>

      <!-- Stats -->
      <div class="panel-section">
        <div class="panel-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Estadísticas
        </div>
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card"><div class="stat-val" id="stat-houses">0</div><div class="stat-lbl">Casas</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-buildings">0</div><div class="stat-lbl">Edificios</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-roads">0</div><div class="stat-lbl">Vías</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-parks">0</div><div class="stat-lbl">Parques</div></div>
        </div>
      </div>

      <!-- Terrain Settings -->
      <div class="panel-section">
        <div class="panel-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
          Terreno 3D (Cámara)
        </div>
        <div class="form-field">
          <label>Exageración (Relieve): <span id="terrainExVal">1.5x</span></label>
          <input type="range" id="terrainExaggeration" min="1" max="5" step="0.1" value="1.5">
        </div>
        <div class="form-field">
          <label>Inclinación (Cámara): <span id="cameraPitchVal">45°</span></label>
          <input type="range" id="cameraPitch" min="0" max="85" step="1" value="45">
        </div>
        <div class="form-field">
          <label>Giro (Brújula): <span id="cameraBearingVal">0°</span></label>
          <input type="range" id="cameraBearing" min="-180" max="180" step="1" value="0">
        </div>
      </div>
    </aside>
  </div>

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- SCRIPTS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
